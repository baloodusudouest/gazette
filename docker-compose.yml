# Service gazette à placer dans la stack homelab.yml (Portainer).
# Les variables viennent des « Environment variables » de la stack (voir .env.example).
# Watchtower désactivé : l'image change seulement quand on choisit la version.
# 0.8 : aucun réglage d'usage ici. Titre du journal, lieu, hôtes, mot par défaut, couleur et Larousse se règlent
# dans l'appli (Réglages › Le journal) ; GAZETTE_TITRE, GAZETTE_SIGNATURE, GAZETTE_LIEU et GAZETTE_LAROUSSE, s'ils
# sont encore posés, sont repris une seule fois au premier démarrage, puis peuvent être retirés.
services:
  gazette:
    image: ghcr.io/baloodusudouest/gazette:${GAZETTE_VERSION:-latest}
    container_name: gazette
    restart: unless-stopped
    ports:
      - "${PORT_GAZETTE:-8089}:8099"                   # 8089 sur le NAS (8099 est pris par la vérification des dates)
    labels:
      - com.centurylinklabs.watchtower.enable=false
    environment:
      - TZ=Europe/Paris
      # Variables communes de la maison (module app/maison.py)
      - MAISON_PASSWORD=${MAISON_PASSWORD}             # mot de passe commun des applis (12 caractères au moins)
      - MAISON_JETON=${MAISON_JETON:-}                 # jeton commun : lecture de carnet, annuaire et sauvegardes de l'Anneau
      - MAISON_LECTURE_SEULE=${MAISON_LECTURE_SEULE:-} # « oui » : aucune appli n'écrit ; GAZETTE_LECTURE_SEULE l'emporte si posée
      # Propres à Gazette
      - GAZETTE_LECTURE_SEULE=${GAZETTE_LECTURE_SEULE:-}   # « oui » ou « non » : force Gazette seule (« oui » : n'imprime rien)
      - GAZETTE_JETON_HA=${GAZETTE_JETON_HA:-}         # jeton de Home Assistant pour /ha/… ; vide : porte fermée
      - GAZETTE_CARNET_URL=${GAZETTE_CARNET_URL:-http://carnet:8096}   # adresse de carnet vue depuis le conteneur
      - GAZETTE_IMMICH_URL=http://immich_server:2283   # 0.9 : Immich vu depuis le conteneur (La Récidive)
      - GAZETTE_IMMICH_CLE=${GAZETTE_IMMICH_CLE:-}     # 0.9 : clé d'API dédiée (asset.read, asset.view, tag.read) ; vide : pas de Récidive
    volumes:
      - ${GAZETTE_DATA_DIR}:/data                      # gazette.db (fiches, livrets, réglages, cache des sources)

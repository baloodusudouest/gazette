# Service gazette à placer dans la stack homelab.yml (Portainer).
# Les variables viennent des « Environment variables » de la stack (voir .env.example).
# Watchtower désactivé : l'image change seulement quand on choisit la version.
# Titre du journal, lieu, hôtes, mot par défaut, couleur, Larousse : réglés dans l'appli (Réglages › Le journal).
services:
  gazette:
    image: ghcr.io/baloodusudouest/gazette:${GAZETTE_VERSION:-latest}
    container_name: gazette
    restart: unless-stopped
    ports:
      - "${PORT_GAZETTE:-8089}:8099"                   # 8089 sur le NAS (8099 est pris par la vérification des dates)
    labels:
      - com.centurylinklabs.watchtower.enable=false
    environment:
      - TZ=Europe/Paris
      # 0.7 : variables communes de la maison (module app/maison.py) ; les anciennes restent lues en repli
      - MAISON_PASSWORD=${MAISON_PASSWORD}             # mot de passe commun des applis (repli : GAZETTE_PASSWORD)
      - MAISON_JETON=${MAISON_JETON:-}                 # jeton commun : lecture de carnet, annuaire de l'Anneau
      - MAISON_LECTURE_SEULE=${MAISON_LECTURE_SEULE:-} # « oui » : aucune appli n'écrit ; GAZETTE_LECTURE_SEULE l'emporte si posée
      # - GAZETTE_PASSWORD=${APPS_PASSWORD}            # ancien nom, lu en repli tant que MAISON_PASSWORD est vide
      - GAZETTE_JETON_HA=${GAZETTE_JETON_HA:-}         # jeton de Home Assistant pour /ha/… ; vide : porte fermée
      - GAZETTE_ADRESSE=${GAZETTE_ADRESSE:-}           # repli de l'adresse de Gazette (tuile « Gazette » de l'Anneau d'abord) ; schéma://hôte:port, sans chemin
      - GAZETTE_LECTURE_SEULE=${GAZETTE_LECTURE_SEULE:-}   # « oui » ou « non » : force Gazette seule (« oui » : n'imprime rien)
      - GAZETTE_CARNET_JETON=${GAZETTE_CARNET_JETON:-} # = CARNET_JETON_GAZETTE de carnet ; envoyé d'abord, puis MAISON_JETON
      - GAZETTE_CARNET_URL=${GAZETTE_CARNET_URL:-http://carnet:8096}   # adresse de carnet vue depuis le conteneur
    volumes:
      - ${GAZETTE_DATA_DIR}:/data                      # gazette.db (fiches, livrets, cache des sources)
